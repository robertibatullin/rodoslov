# Example config for faker: generation from a progenitor
# Run "rodoslov-faker example_community/Doe" to regenerate Doe.yaml
progenitor:
  birth_year: 1950
  gender: M
  surname: Doe

majorat: false
retry_until_survives: false
max-attempts: 1000

name_sources:
  dir: "example_community/name_sources"
  male: british_m.csv
  female: british_f.csv
  male_surnames: british_s.csv
  female_surnames: british_s.csv

write_file: true
output_path: Doe.yaml
